[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commons-family"
version = "0.1.0"
description = "Six-player simultaneous commons games with private native decisions"
requires-python = ">=3.11,<3.14"
dependencies = [
  "coworld>=0.1.57",
  "fastapi==0.115.5",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "uvicorn[standard]==0.34.2",
  "websockets==15.0.1",
  "pydantic>=2.11.5",
  "numpy==2.2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/commons_family"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
